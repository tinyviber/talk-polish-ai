name: CI

on:
  push:
    branches:
      - main
      # Deployment candidate: runs complete CI on its exact branch head before
      # an operator creates immutable deploy/<full-commit-sha> tag.
      - codex/daily-story-conversation
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Verify web release artifacts
        run: |
          test -f apps/web/.output/server/index.mjs
          test -f apps/web/.output/public/sw.js
          test -f apps/web/.output/public/manifest.webmanifest
          test -f apps/web/.output/public/offline.html
          node <<'NODE'
          const fs = require("node:fs");
          const sw = fs.readFileSync("apps/web/.output/public/sw.js", "utf8");
          if (!sw.includes("offline.html") || !/assets\/[^"']+\.(?:js|css)/.test(sw)) {
            throw new Error("PWA service worker is missing offline or hashed app-shell precache entries");
          }
          NODE
      - name: Smoke test production web server
        run: |
          set -Eeuo pipefail
          server_log="$(mktemp)"
          server_pid=""

          cleanup() {
            exit_code=$?
            trap - EXIT

            if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
              kill -- "-$server_pid" 2>/dev/null || true
              for _ in {1..10}; do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              kill -KILL -- "-$server_pid" 2>/dev/null || true
            fi
            if [[ -n "$server_pid" ]]; then
              wait "$server_pid" 2>/dev/null || true
            fi

            if (( exit_code != 0 )); then
              echo "Production web server log:" >&2
              cat "$server_log" >&2
            fi
            rm -f "$server_log"
            exit "$exit_code"
          }
          trap cleanup EXIT

          setsid bun run start:web >"$server_log" 2>&1 &
          server_pid=$!

          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Production web server exited before becoming ready" >&2
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 5 \
              -D "$server_log.headers" -o "$server_log.html" \
              http://127.0.0.1:3000/; then
              curl --fail --silent --show-error --max-time 5 \
                -D "$server_log.second.headers" -o /dev/null \
                http://127.0.0.1:3000/
              node - "$server_log.html" "$server_log.headers" "$server_log.second.headers" <<'NODE'
              const fs = require("node:fs");
              const html = fs.readFileSync(process.argv[2], "utf8");
              const firstHeaders = fs.readFileSync(process.argv[3], "utf8");
              const secondHeaders = fs.readFileSync(process.argv[4], "utf8");
              const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];

              if (scripts.length === 0) {
                throw new Error("Production shell did not contain a script tag to validate");
              }

              function cspFrom(headers) {
                const response = headers.trim().split(/\r?\n\r?\n/).at(-1);
                const values = response
                  .split(/\r?\n/)
                  .filter((line) => line.toLowerCase().startsWith("content-security-policy:"))
                  .map((line) => line.slice(line.indexOf(":") + 1).trim());
                if (values.length !== 1) {
                  throw new Error(`Expected exactly one CSP response header; got ${values.length}`);
                }
                const csp = values[0];
                if (!/connect-src\s+'self'(?:\s*;|$)/.test(csp)) {
                  throw new Error("Production CSP must restrict connect-src to self");
                }
                const scriptSource = csp.match(/(?:^|;)\s*script-src\s+([^;]+)/)?.[1];
                if (!scriptSource || scriptSource.includes("unsafe-inline")) {
                  throw new Error("Production script-src must not contain unsafe-inline");
                }
                const nonce = scriptSource.match(/^'self'\s+'nonce-([^']+)'$/)?.[1];
                if (!nonce) {
                  throw new Error("Production CSP must bind script-src to a request nonce");
                }
                return nonce;
              }

              const firstNonce = cspFrom(firstHeaders);
              const secondNonce = cspFrom(secondHeaders);
              if (firstNonce === secondNonce) {
                throw new Error("Production CSP nonce must differ between HTML responses");
              }

              let inlineScriptCount = 0;
              for (const [, attributes, body] of scripts) {
                const src = attributes.match(/\bsrc\s*=\s*["']([^"']+)["']/i)?.[1];
                const nonce = attributes.match(/\bnonce\s*=\s*["']([^"']+)["']/i)?.[1];
                if (src && (!src.startsWith("/") || src.startsWith("//"))) {
                  throw new Error(`Production shell script is not same-origin: ${src}`);
                }
                if (!src) inlineScriptCount += 1;
                if (!nonce || nonce !== firstNonce) {
                  throw new Error("Every production script must use the response CSP nonce");
                }
                if (src && body.trim() !== "") {
                  throw new Error("External production script tag unexpectedly has inline content");
                }
              }
              if (inlineScriptCount === 0) {
                throw new Error("Production shell did not exercise nonce protection for streamed inline scripts");
              }
              exit 0
          NODE
            fi
            if (( attempt == 30 )); then
              echo "Production web server did not respond successfully on port 3000" >&2
              exit 1
            fi
            sleep 1
          done
      - name: Validate reverse proxy configs
        run: |
          set -Eeuo pipefail

          for file in README.md docs/deployment-pwa.md deploy/Caddyfile; do
            grep -Fq 'max_size 30MiB' "$file"
          done
          if grep -Fq 'max_size 30MB' README.md docs/deployment-pwa.md; then
            echo 'README/docs must not use decimal Caddy body-size units' >&2
            exit 1
          fi
          if rg -n '^[[:space:]]*(add_header[[:space:]]+)?Content-Security-Policy\b' \
            deploy/Caddyfile deploy/nginx.conf; then
            echo 'Proxies must forward web CSP nonce header, not add static CSP' >&2
            exit 1
          fi

          nginx_tmp_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$nginx_tmp_dir"
          }
          trap cleanup EXIT

          mkdir -p "$nginx_tmp_dir/certs"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=example.com" \
            -keyout "$nginx_tmp_dir/certs/privkey.pem" \
            -out "$nginx_tmp_dir/certs/fullchain.pem"
          printf '%s\n' \
            'events {}' \
            'http {' \
            '  include /etc/nginx/mime.types;' \
            '  include /etc/nginx/conf.d/kotoba.conf;' \
            '}' > "$nginx_tmp_dir/nginx.conf"

          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/kotoba.conf:ro" \
            -v "$nginx_tmp_dir/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$nginx_tmp_dir/certs:/etc/letsencrypt/live/example.com:ro" \
            nginx:1.27-alpine \
            nginx -t -c /etc/nginx/nginx.conf

          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: bun run build:docker

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kotoba
          POSTGRES_PASSWORD: kotoba
          POSTGRES_DB: kotoba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kotoba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kotoba:kotoba@localhost:5432/kotoba
      ANON_TOKEN_SECRET: ci-integration-anon-token-secret
      DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
