name: Publish images to TCR Personal

on:
  # main may publish the current production candidate. A Daily Story candidate
  # publishes only after its exact, green branch SHA is named by an annotated
  # deploy/<40-char-commit-sha> tag.
  push:
    branches: [main]
    tags: ["deploy/*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-tcr-${{ github.ref }}
  cancel-in-progress: false

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE || 'kotoba' }}
  API_REPOSITORY: ${{ vars.TCR_API_REPOSITORY || 'kotoba-api' }}
  WEB_REPOSITORY: ${{ vars.TCR_WEB_REPOSITORY || 'kotoba-web' }}

jobs:
  resolve-release:
    name: Resolve immutable release commit
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.release.outputs.build_sha }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
    steps:
      - id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          github_api() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --connect-timeout 10 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$1"
          }

          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            build_sha="$GITHUB_SHA"
            publish_latest=true
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            deploy_tag="$GITHUB_REF_NAME"
            if [[ ! "$deploy_tag" =~ ^deploy/([0-9a-f]{40})$ ]]; then
              echo "Tag must be deploy/<40-char-lowercase-commit-sha>; got $deploy_tag" >&2
              exit 1
            fi
            named_sha="${BASH_REMATCH[1]}"

            # A lightweight tag can move independently. Require an annotated
            # tag object whose peeled commit is exactly its name's SHA.
            ref_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$deploy_tag")"
            tag_object_sha="$(jq -er '.object.sha' <<<"$ref_json")"
            tag_object_type="$(jq -er '.object.type' <<<"$ref_json")"
            if [ "$tag_object_type" != "tag" ]; then
              echo "Deployment tag must be annotated, not lightweight" >&2
              exit 1
            fi

            tag_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag_json")"
            build_sha="$(jq -er '.object.sha' <<<"$tag_json")"
            if [ "$object_type" != "commit" ] || [ "$build_sha" != "$named_sha" ]; then
              echo "Deployment tag does not peel to commit named in tag" >&2
              exit 1
            fi
            publish_latest=false
          else
            echo "Unsupported ref type: $GITHUB_REF_TYPE" >&2
            exit 1
          fi

          if [[ ! "$build_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved build SHA is not a full lowercase commit SHA" >&2
            exit 1
          fi

          # A deploy tag is only an immutable name. It must not turn an
          # untested commit into a release: require one successful run of this
          # repository's CI workflow on this exact commit, then verify both
          # release-critical jobs in that run completed successfully.
          ci_run_id=""
          for attempt in {1..120}; do
            runs_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$build_sha&per_page=100")"
            ci_run_id="$(jq -r --arg sha "$build_sha" '
              [
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
                | .id
              ]
              | .[0] // ""
            ' <<<"$runs_json")"
            if [ -n "$ci_run_id" ]; then
              break
            fi

            ci_state="$(jq -r --arg sha "$build_sha" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | if length == 0 then "missing"
                elif any(.[]; .status != "completed") then "running"
                else "failed"
                end
            ' <<<"$runs_json")"
            if [ "$ci_state" = "failed" ]; then
              echo "CI workflow did not succeed for release commit $build_sha" >&2
              exit 1
            fi
            if [ "$attempt" = 120 ]; then
              echo "Timed out waiting for CI workflow on release commit $build_sha" >&2
              exit 1
            fi
            sleep 15
          done

          jobs_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?filter=latest&per_page=100")"
          for required_job in checks integration; do
            if ! jq -e --arg name "$required_job" '
              any(.jobs[]; .name == $name and .status == "completed" and .conclusion == "success")
            ' <<<"$jobs_json" >/dev/null; then
              echo "Successful CI run $ci_run_id is missing required job: $required_job" >&2
              exit 1
            fi
          done

          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish immutable images
    needs: resolve-release
    runs-on: [self-hosted, txc]
    timeout-minutes: 45
    env:
      BUILD_SHA: ${{ needs.resolve-release.outputs.build_sha }}
      PUBLISH_LATEST: ${{ needs.resolve-release.outputs.publish_latest }}
    outputs:
      api_image: ${{ steps.build_api.outputs.image_ref }}
      web_image: ${{ steps.build_web.outputs.image_ref }}
    steps:
      - name: Download exact source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/source-$BUILD_SHA"
          archive="$RUNNER_TEMP/source-$BUILD_SHA.tar.gz"
          mkdir -p "$source_dir"
          curl --fail --silent --show-error --location --http1.1 \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 180 \
            -o "$archive" \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$BUILD_SHA"
          tar -xzf "$archive" --strip-components=1 -C "$source_dir"

      - name: Validate TCR repository settings
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$TCR_NAMESPACE"
          test -n "$API_REPOSITORY"
          test -n "$WEB_REPOSITORY"

      - name: Login to TCR Personal
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$TCR_USERNAME"
          test -n "$TCR_PASSWORD"
          printf '%s' "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" \
            --username "$TCR_USERNAME" --password-stdin

      - name: Mirror pinned Bun and Node runtime images to TCR if needed
        shell: bash
        run: |
          set -Eeuo pipefail

          mirror_if_missing() {
            source_image="$1"
            target_image="$2"
            if docker manifest inspect "$target_image" >/dev/null 2>&1; then
              echo "TCR hit: $target_image"
              return 0
            fi

            echo "TCR miss: $target_image; mirror $source_image"
            docker pull "$source_image"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
          }

          image_prefix="$TCR_REGISTRY/$TCR_NAMESPACE"
          mirror_if_missing oven/bun:1.2.17 "$image_prefix/oven-bun:1.2.17"
          mirror_if_missing node:22-alpine "$image_prefix/node:22-alpine"

      - name: Set up Docker Buildx
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! docker buildx inspect txc-builder >/dev/null 2>&1; then
            docker buildx create --name txc-builder --driver docker-container
          fi
          docker buildx use txc-builder
          docker buildx inspect --bootstrap

      - name: Build and push API image
        id: build_api
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/source-$BUILD_SHA"
          image="$TCR_REGISTRY/$TCR_NAMESPACE/$API_REPOSITORY"
          tags=(--tag "$image:sha-$BUILD_SHA")
          if [ "$PUBLISH_LATEST" = true ]; then
            tags+=(--tag "$image:latest")
          fi

          cd "$source_dir"
          docker buildx build \
            --file apps/api/Dockerfile \
            --platform linux/amd64 \
            --build-arg "BUN_BASE_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/oven-bun:1.2.17" \
            --push \
            --progress plain \
            "${tags[@]}" \
            .

          # The self-hosted publisher has Docker Buildx but not a guaranteed jq.
          # Query the immutable SHA tag it just pushed instead of parsing Buildx
          # metadata; keep reading to EOF so pipefail cannot hide a SIGPIPE.
          digest="$(docker buildx imagetools inspect "$image:sha-$BUILD_SHA" | awk '$1 == "Digest:" { value=$2 } END { print value }')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "API build did not emit an immutable OCI digest" >&2
            exit 1
          fi
          echo "image_ref=$image@$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        id: build_web
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/source-$BUILD_SHA"
          image="$TCR_REGISTRY/$TCR_NAMESPACE/$WEB_REPOSITORY"
          tags=(--tag "$image:sha-$BUILD_SHA")
          if [ "$PUBLISH_LATEST" = true ]; then
            tags+=(--tag "$image:latest")
          fi

          cd "$source_dir"
          docker buildx build \
            --file apps/web/Dockerfile \
            --platform linux/amd64 \
            --build-arg "BUN_BASE_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/oven-bun:1.2.17" \
            --build-arg "NODE_RUNTIME_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/node:22-alpine" \
            --build-arg VITE_APP_MODE=api \
            --build-arg VITE_API_URL= \
            --build-arg "VITE_BUILD_ID=$BUILD_SHA" \
            --push \
            --progress plain \
            "${tags[@]}" \
            .

          # See the API build: resolve the registry digest without jq.
          digest="$(docker buildx imagetools inspect "$image:sha-$BUILD_SHA" | awk '$1 == "Digest:" { value=$2 } END { print value }')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Web build did not emit an immutable OCI digest" >&2
            exit 1
          fi
          echo "image_ref=$image@$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable image references
        env:
          API_IMAGE: ${{ steps.build_api.outputs.image_ref }}
          WEB_IMAGE: ${{ steps.build_web.outputs.image_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## TCR release"
            echo
            echo "- Source commit: \`$BUILD_SHA\`"
            echo "- API immutable image: \`$API_IMAGE\`"
            echo "- Web immutable image: \`$WEB_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
