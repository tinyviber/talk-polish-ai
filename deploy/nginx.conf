# Example HTTPS reverse proxy. Put the map in the http{} context when this is
# included from sites-enabled, then replace the certificate paths.
map $uri $kotoba_cache_control {
  default "";
  =/sw.js "no-cache";
  =/manifest.webmanifest "no-cache";
  =/offline.html "no-cache";
  ~*\.(?:js|css|png|svg|ttf|woff2)$ "public, max-age=31536000, immutable";
}

server {
  listen 443 ssl http2;
  server_name example.com;

  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  # Web emits one strict CSP with a fresh request nonce for TanStack's
  # streamed bootstrap script. Do not add a static CSP here: a second policy
  # intersects with upstream policy and rejects the nonce. Nginx forwards the
  # upstream Content-Security-Policy response header by default.
  add_header Cache-Control $kotoba_cache_control always;

  location /api/ {
    # Fastify accepts up to MAX_UPLOAD_BYTES (25 MiB by default). The proxy
    # limits the entire multipart body, so leave room for multipart overhead.
    client_max_body_size 30m;
    # AI processing can legally exceed 180s; allow up to 420s for upstream
    # response data and request writes before the proxy terminates the call.
    proxy_read_timeout 420s;
    proxy_send_timeout 420s;
    proxy_pass http://127.0.0.1:3333;
    proxy_set_header Host $host;
    # Overwrite, do not append, so Fastify's trusted-proxy IP is the direct
    # address of this known proxy rather than a client-supplied chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /realtime/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server { listen 80; server_name example.com; return 301 https://$host$request_uri; }
