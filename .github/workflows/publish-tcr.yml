name: Publish images to TCR Personal

on:
  workflow_dispatch:
    inputs:
      sync_runtime_images:
        description: Mirror missing pinned PostgreSQL and MinIO images to TCR
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - codex/finish-durable-ai-architecture

concurrency:
  group: publish-tcr-${{ github.ref }}
  cancel-in-progress: true

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE || 'kotoba' }}
  API_REPOSITORY: ${{ vars.TCR_API_REPOSITORY || 'kotoba-api' }}
  WEB_REPOSITORY: ${{ vars.TCR_WEB_REPOSITORY || 'kotoba-web' }}

jobs:
  publish:
    runs-on: [self-hosted, txc]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        run: |
          set -Eeuo pipefail
          download_repo() {
            ref="$1"
            destination="$2"
            archive="$RUNNER_TEMP/repo-$ref.tar.gz"

            mkdir -p "$destination"
            curl -fL --http1.1 --retry 5 --retry-all-errors \
              --connect-timeout 10 --max-time 180 \
              -o "$archive" \
              "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$ref"
            tar -xzf "$archive" --strip-components=1 -C "$destination"
          }

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          download_repo "$GITHUB_SHA" "$GITHUB_WORKSPACE"

      - name: Validate TCR repository settings
        run: |
          set -Eeuo pipefail
          test -n "$TCR_NAMESPACE"
          test -n "$API_REPOSITORY"
          test -n "$WEB_REPOSITORY"

      - name: Login to TCR Personal
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$TCR_USERNAME"
          test -n "$TCR_PASSWORD"
          printf '%s' "$TCR_PASSWORD" \
            | docker login "$TCR_REGISTRY" \
                --username "$TCR_USERNAME" \
                --password-stdin

      - name: Mirror Bun base image to TCR
        run: |
          set -Eeuo pipefail
          base_image="$TCR_REGISTRY/$TCR_NAMESPACE/oven-bun:1.2.17"

          if docker manifest inspect "$base_image" >/dev/null 2>&1; then
            echo "TCR hit: $base_image"
          else
            echo "TCR miss: $base_image; mirroring oven/bun:1.2.17"
            docker pull oven/bun:1.2.17
            docker tag oven/bun:1.2.17 "$base_image"
            docker push "$base_image"
          fi

      - name: Mirror Node runtime image to TCR
        run: |
          set -Eeuo pipefail
          runtime_image="$TCR_REGISTRY/$TCR_NAMESPACE/node:22-alpine"

          if docker manifest inspect "$runtime_image" >/dev/null 2>&1; then
            echo "TCR hit: $runtime_image"
          else
            echo "TCR miss: $runtime_image; mirroring node:22-alpine"
            docker pull node:22-alpine
            docker tag node:22-alpine "$runtime_image"
            docker push "$runtime_image"
          fi

      - name: Set up Docker Buildx
        run: |
          set -Eeuo pipefail
          if ! docker buildx inspect txc-builder >/dev/null 2>&1; then
            docker buildx create --name txc-builder --driver docker-container
          fi
          docker buildx use txc-builder
          docker buildx inspect --bootstrap

      # These are the images used by docker-compose.yml on the deployment host.
      # Only run this on an explicit manual request. Normal application pushes
      # must not wait for Docker Hub or re-sync unchanged runtime dependencies.
      - name: Mirror missing runtime images to TCR
        if: github.event_name == 'workflow_dispatch' && inputs.sync_runtime_images == true
        shell: bash
        run: |
          set -Eeuo pipefail

          mirror_if_missing() {
            source_image="$1"
            target_image="$2"

            if docker manifest inspect "$target_image" >/dev/null 2>&1; then
              echo "TCR hit: $target_image"
              return 0
            fi

            echo "TCR miss: $target_image; mirroring $source_image"
            docker pull "$source_image"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
          }

          image_prefix="$TCR_REGISTRY/$TCR_NAMESPACE"

          mirror_if_missing \
            postgres:16-alpine \
            "$image_prefix/postgres:16-alpine"

          mirror_if_missing \
            minio/minio:RELEASE.2024-12-18T13-15-44Z \
            "$image_prefix/minio:RELEASE.2024-12-18T13-15-44Z"

          mirror_if_missing \
            minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1 \
            "$image_prefix/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1"

      - name: Detect API image changes
        id: api_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          # Manual runs are explicit rebuild requests.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$EVENT_BEFORE" ] || [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            echo "API image: rebuild (manual run)"
            exit 0
          fi

          api_paths=(
            .dockerignore
            package.json
            bun.lock
            bunfig.toml
            apps/api
            apps/web/package.json
            packages/contracts
          )

          before_dir="$RUNNER_TEMP/repo-before"
          before_archive="$RUNNER_TEMP/repo-before-$EVENT_BEFORE.tar.gz"
          mkdir -p "$before_dir"
          curl -fL --http1.1 --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 180 \
            -o "$before_archive" \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$EVENT_BEFORE"
          tar -xzf "$before_archive" --strip-components=1 -C "$before_dir"

          api_changed=false
          for path in "${api_paths[@]}"; do
            current_path="$GITHUB_WORKSPACE/$path"
            before_path="$before_dir/$path"

            if [ -e "$current_path" ] || [ -e "$before_path" ]; then
              if ! diff -qr "$current_path" "$before_path" >/dev/null 2>&1; then
                api_changed=true
                break
              fi
            fi
          done

          if [ "$api_changed" = false ]; then
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
            echo "API image: unchanged; skip build and push"
          else
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            echo "API image: relevant files changed; rebuild"
          fi

      - name: Extract API image metadata
        id: meta
        if: steps.api_changes.outputs.api_changed == 'true'
        run: |
          set -Eeuo pipefail
          echo "API_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/$API_REPOSITORY" >> "$GITHUB_ENV"
          echo "API_SHA_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Detect web image changes
        id: web_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$EVENT_BEFORE" ] || [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
            echo "Web image: rebuild (manual run)"
            exit 0
          fi

          web_paths=(
            .dockerignore
            package.json
            bun.lock
            bunfig.toml
            apps/web
            packages/contracts
          )

          before_dir="$RUNNER_TEMP/repo-before-web"
          before_archive="$RUNNER_TEMP/repo-before-web-$EVENT_BEFORE.tar.gz"
          mkdir -p "$before_dir"
          curl -fL --http1.1 --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 180 \
            -o "$before_archive" \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$EVENT_BEFORE"
          tar -xzf "$before_archive" --strip-components=1 -C "$before_dir"

          web_changed=false
          for path in "${web_paths[@]}"; do
            current_path="$GITHUB_WORKSPACE/$path"
            before_path="$before_dir/$path"

            if [ -e "$current_path" ] || [ -e "$before_path" ]; then
              if ! diff -qr "$current_path" "$before_path" >/dev/null 2>&1; then
                web_changed=true
                break
              fi
            fi
          done

          echo "web_changed=$web_changed" >> "$GITHUB_OUTPUT"
          if [ "$web_changed" = true ]; then
            echo "Web image: relevant files changed; rebuild"
          else
            echo "Web image: unchanged; skip build and push"
          fi

      - name: Extract web image metadata
        id: web_meta
        if: steps.web_changes.outputs.web_changed == 'true'
        run: |
          set -Eeuo pipefail
          echo "WEB_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/$WEB_REPOSITORY" >> "$GITHUB_ENV"
          echo "WEB_SHA_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build API image
        if: steps.api_changes.outputs.api_changed == 'true'
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file apps/api/Dockerfile \
            --platform linux/amd64 \
            --build-arg "BUN_BASE_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/oven-bun:1.2.17" \
            --tag "$API_IMAGE:latest" \
            --tag "$API_IMAGE:$API_SHA_TAG" \
            --progress plain \
            --load \
            .

      - name: Push API image to TCR
        if: steps.api_changes.outputs.api_changed == 'true'
        run: |
          set -Eeuo pipefail
          docker push "$API_IMAGE:latest"
          docker push "$API_IMAGE:$API_SHA_TAG"

      - name: Build web image
        if: steps.web_changes.outputs.web_changed == 'true'
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file apps/web/Dockerfile \
            --platform linux/amd64 \
            --build-arg "BUN_BASE_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/oven-bun:1.2.17" \
            --build-arg "NODE_RUNTIME_IMAGE=$TCR_REGISTRY/$TCR_NAMESPACE/node:22-alpine" \
            --build-arg VITE_APP_MODE=api \
            --build-arg VITE_API_URL= \
            --tag "$WEB_IMAGE:latest" \
            --tag "$WEB_IMAGE:$WEB_SHA_TAG" \
            --progress plain \
            --load \
            .

      - name: Push web image to TCR
        if: steps.web_changes.outputs.web_changed == 'true'
        run: |
          set -Eeuo pipefail
          docker push "$WEB_IMAGE:latest"
          docker push "$WEB_IMAGE:$WEB_SHA_TAG"
