name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: docker build --file apps/api/Dockerfile .

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kotoba
          POSTGRES_PASSWORD: kotoba
          POSTGRES_DB: kotoba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kotoba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kotoba:kotoba@localhost:5432/kotoba
      ANON_TOKEN_SECRET: ci-integration-anon-token-secret
      DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17
      - run: bun install --frozen-lockfile
      - run: bun --filter @kotoba/api run test:integration
